<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGeR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <noscript>Esta aplicación necesita JavaScript habilitado.</noscript>
  <header class="topbar" id="top"></header>

  <main class="auth">
    <div class="card">
      <img class="logo" src="../assets/logo-sger.svg" alt="SGeR">

      <!-- Selector entre ingresar y registrarse -->
      <div class="seg">
        <button type="button" id="boton-ingresar" class="on" data-i18n="login.in"></button>
        <button type="button" id="boton-registrarse" data-i18n="login.up"></button>
      </div>

      <!-- Formulario para ingresar -->
      <form id="form-ingreso" novalidate>
        <label class="f">
          <span data-i18n="k.CI"></span>
          <input type="text" name="ci" inputmode="numeric" autocomplete="username" data-i18n-ph="ph.ci">
        </label>
        <label class="f">
          <span data-i18n="k.PASSWORD"></span>
          <input type="password" name="password" autocomplete="current-password">
        </label>
        <div id="mensaje-ingreso" class="msg hidden" role="alert"></div>
        <button type="submit" class="btn pri" data-i18n="login.enter"></button>
      </form>

      <!-- Formulario para registrarse (empieza oculto) -->
      <form id="form-registro" class="hidden" novalidate>
        <label class="f">
          <span data-i18n="k.CI"></span>
          <input type="text" name="ci" inputmode="numeric" autocomplete="off" data-i18n-ph="ph.ci">
        </label>
        <label class="f">
          <span data-i18n="k.TYPEUSER"></span>
          <select name="tipo" id="registro-tipo"></select>
        </label>
        <label class="f">
          <span data-i18n="k.PASSWORD"></span>
          <input type="password" name="password" autocomplete="new-password">
        </label>
        <label class="f">
          <span data-i18n="login.repeat"></span>
          <input type="password" name="password2" autocomplete="new-password">
        </label>
        <div id="mensaje-registro" class="msg hidden" role="alert"></div>
        <button type="submit" class="btn pri" data-i18n="login.send"></button>
      </form>
    </div>
  </main>

  <div id="foot"></div>

  <script src="../js/errores-globales.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/constantes.js"></script>
  <script src="../js/idiomas/es.js"></script>
  <script src="../js/idiomas/en.js"></script>
  <script src="../js/idiomas/pt.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/dom.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/encabezado.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
