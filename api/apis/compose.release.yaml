# Nombre fijo del proyecto: así "docker compose" encuentra los contenedores
# (sigeru-*) y el volumen (sigeru_mysql_data) sin importar en qué carpeta
# esté instalado SiGeRU.
name: sigeru

services:
  front:
    image: ${FRONT_IMAGE:?Define FRONT_IMAGE en .env}
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      api-planificador:
        condition: service_started
      api-admin-operador:
        condition: service_started
      api-admin-sistema:
        condition: service_started
      api-operador:
        condition: service_started
      api-vecino:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - gateway

  api-planificador: &api
    image: ${APP_IMAGE:?Define APP_IMAGE en .env}
    environment: &api-environment
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-app_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      DB_NAME: ${MYSQL_DATABASE:-DB}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?Define TOKEN_SIGNING_SECRET en .env}
      PASSWORD_HASH_SECRET: ${PASSWORD_HASH_SECRET:?Define PASSWORD_HASH_SECRET en .env}
    depends_on: &api-depends
      db:
        condition: service_healthy
    healthcheck: &api-healthcheck
      test: ["CMD", "php", "-r", "$$c=@fsockopen('127.0.0.1',80); exit($$c?0:1);"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: &api-networks
      - gateway
      - data

  api-admin-operador:
    <<: *api

  api-admin-sistema:
    <<: *api

  api-operador:
    <<: *api

  api-vecino:
    <<: *api

  db:
    image: ${DB_IMAGE:?Define DB_IMAGE en .env}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-DB}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - data

  database-backup:
    image: ${DB_BACKUP_IMAGE:?Define DB_BACKUP_IMAGE en .env}
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-DB}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      TZ: ${BACKUP_TIMEZONE:-America/Montevideo}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data

  project-backup:
    image: ${PROJECT_BACKUP_IMAGE:?Define PROJECT_BACKUP_IMAGE en .env}
    environment:
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      TZ: ${BACKUP_TIMEZONE:-America/Montevideo}
      BACKUP_RETENTION_WEEKS: ${BACKUP_RETENTION_WEEKS:-4}
    volumes:
      - ./:/source:ro
      - ./backups:/backups
    restart: unless-stopped

  backup-check:
    image: ${BACKUP_CHECK_IMAGE:?Define BACKUP_CHECK_IMAGE en .env}
    environment:
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-3600}
    volumes:
      - ./backups:/backups:ro
    depends_on:
      - database-backup
      - project-backup
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  gateway:
    driver: bridge
  data:
    driver: bridge
    internal: true
