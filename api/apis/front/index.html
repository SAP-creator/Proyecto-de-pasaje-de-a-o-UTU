<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGeR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript>Esta aplicación necesita JavaScript habilitado.</noscript>
  <header class="topbar" id="top"></header>

  <main>
    <!-- Presentación: texto de SGeR a la izquierda, dos tarjetas a la derecha y la foto de los camiones de fondo. -->
    <section class="hero">
      <div class="copy">
        <h1 data-i18n="home.title"></h1>
        <p data-i18n="home.lead"></p>
        <div class="cta">
          <a class="login" href="pages/login.html" data-i18n="nav.login"></a>
          <a class="btn pri pill" href="pages/login.html?m=up" data-i18n="nav.signup"></a>
        </div>
      </div>

      <div class="stack">
        <div class="slot" data-i18n="home.s2"></div>
        <div class="slot" data-i18n="home.s3"></div>
      </div>
    </section>

    <!-- Foto de los camiones a la izquierda y texto sobre el trabajo a la derecha. -->
    <section class="band">
      <img class="photo" src="assets/camiones-noche.jpg" data-i18n-alt="home.work.alt" alt="">
      <div class="text">
        <h2 data-i18n="home.work.title"></h2>
        <p data-i18n="home.work.text"></p>
      </div>
    </section>

    <!-- Llamada a participar y botones de ingreso. -->
    <section class="join">
      <div class="join-banner">
        <h2 data-i18n="home.join"></h2>
      </div>
      <div class="cta">
        <a class="login" href="pages/login.html" data-i18n="nav.login"></a>
        <a class="btn pri pill" href="pages/login.html?m=up" data-i18n="nav.signup"></a>
      </div>
    </section>
  </main>

  <div id="foot"></div>

  <script src="js/errores-globales.js"></script>
  <script src="js/config.js"></script>
  <script src="js/constantes.js"></script>
  <script src="js/idiomas/es.js"></script>
  <script src="js/idiomas/en.js"></script>
  <script src="js/idiomas/pt.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/sesion.js"></script>
  <script src="js/api.js"></script>
  <script src="js/encabezado.js"></script>
  <script src="js/inicio.js"></script>
</body>
</html>
