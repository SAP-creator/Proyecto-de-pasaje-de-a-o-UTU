x-api-common: &api-common
  image: ${APP_IMAGE:-sigeru/api:latest}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  environment:
    DB_HOST: db
    DB_PORT: 3306
    DB_USER: ${MYSQL_USER:-app_user}
    DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    DB_NAME: ${MYSQL_DATABASE:-DB}
    TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:?Define TOKEN_SIGNING_SECRET en .env}
    PASSWORD_HASH_SECRET: ${PASSWORD_HASH_SECRET:?Define PASSWORD_HASH_SECRET en .env}
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "php", "-r", "$$c=@fsockopen('127.0.0.1',80); exit($$c?0:1);"]
    interval: 30s
    timeout: 5s
    retries: 3
  restart: unless-stopped
  networks:
    - gateway
    - data

services:
  front:
    image: ${FRONT_IMAGE:-sigeru/front:latest}
    build:
      context: .
      dockerfile: docker/front/Dockerfile
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      api-planificador:
        condition: service_started
      api-admin-operador:
        condition: service_started
      api-admin-sistema:
        condition: service_started
      api-operador:
        condition: service_started
      api-vecino:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - gateway

  api-planificador:
    <<: *api-common

  api-admin-sistema:
    <<: *api-common

  api-admin-operador:
    <<: *api-common

  api-operador:
    <<: *api-common

  api-vecino:
    <<: *api-common

  db:
    image: ${DB_IMAGE:-sigeru/db:latest}
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-DB}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - data

  database-backup:
    image: ${DB_BACKUP_IMAGE:-sigeru/database-backup:latest}
    build:
      context: .
      dockerfile: docker/backup/database.Dockerfile
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-DB}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      TZ: ${BACKUP_TIMEZONE:-America/Montevideo}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - data

  project-backup:
    image: ${PROJECT_BACKUP_IMAGE:-sigeru/project-backup:latest}
    build:
      context: .
      dockerfile: docker/backup/project.Dockerfile
    environment:
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      TZ: ${BACKUP_TIMEZONE:-America/Montevideo}
      BACKUP_RETENTION_WEEKS: ${BACKUP_RETENTION_WEEKS:-4}
    volumes:
      - ./:/source:ro
      - ./backups:/backups
    restart: unless-stopped

  backup-check:
    image: ${BACKUP_CHECK_IMAGE:-sigeru/backup-check:latest}
    build:
      context: .
      dockerfile: docker/backup/check.Dockerfile
    environment:
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-3600}
    volumes:
      - ./backups:/backups:ro
    depends_on:
      - database-backup
      - project-backup
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  gateway:
    driver: bridge
  data:
    driver: bridge
    internal: true
